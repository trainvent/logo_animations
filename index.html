<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Le Logo | Motion Study</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="motion-page">
      <nav class="topbar">
        <a class="brand" href="./">LE / <span>MOTION STUDY</span></a>
        <a class="tool-link" href="./path-tool/">Edit path <span aria-hidden="true">↗</span></a>
      </nav>

      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow">A continuous gesture</p>
          <h1>The line<br /><em>remembers.</em></h1>
          <p class="lede">A single route through 24 connected segments, recorded from the numbered path study.</p>
        </div>
        <div class="route-meta">
          <span class="meta-label">LIVE ROUTE</span>
          <span id="route-state">READY</span>
        </div>
      </section>

      <section class="stage" aria-label="Animated logo">
        <div class="stage-header"><span>01 / 01</span><span id="segment-readout">24 SEGMENTS</span></div>
        <svg id="logo" viewBox="0 0 900 900" role="img" aria-label="The Le Logo drawing itself">
          <circle class="guide" cx="450" cy="450" r="445" />
          <path class="guide" d="M450 9.45 L831.5275 670.275 L68.4725 670.275 Z" />
          <path class="guide" d="M548.3474 179.7927 L634.8327 670.275 L166.8199 499.9323 Z" />
          <path class="guide" d="M570.641 306.2257 L514.1917 626.3653 L265.1673 417.409 Z" />
          <path class="guide" d="M556.0899 388.749 L450 572.502 L343.9101 388.749 Z" />
          <path id="route" />
          <circle id="pen-halo" cx="450" cy="9.45" r="22" />
          <circle id="pen" cx="450" cy="9.45" r="8" />
        </svg>
        <div class="progress-track"><span id="progress"></span></div>
      </section>

      <section class="controls" aria-label="Animation controls">
        <div class="control-copy"><span class="eyebrow">Playback</span><strong id="time-readout">00:00</strong></div>
        <div class="button-row">
          <button id="play" class="button button-primary" type="button"><span aria-hidden="true">▶</span> Play route</button>
          <button id="pause" class="button" type="button"><span aria-hidden="true">Ⅱ</span> Pause</button>
          <button id="replay" class="button" type="button"><span aria-hidden="true">↺</span> Replay</button>
        </div>
        <label class="speed-control" for="speed">Tempo <output id="speed-value">1.0×</output><input id="speed" type="range" min="0.5" max="2" step="0.25" value="1" /></label>
      </section>

      <footer><span>Permanent route / 24 edges / one stroke</span><span class="mono">TRAINVENT / 2026</span></footer>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
